services:

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: de-clickhouse

    ports:
      - "${CLICKHOUSE_HTTP_PORT}:8123"
      - "${CLICKHOUSE_NATIVE_PORT}:9000"

    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}

    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./src/sql/ddl:/app/sql/ddl:ro
      - ./docker/clickhouse/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro

    mem_limit: 3g
    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - clickhouse-client
        - --user
        - ${CLICKHOUSE_USER}
        - --password
        - ${CLICKHOUSE_PASSWORD}
        - --query
        - SELECT 1
      interval: 5s
      timeout: 5s
      retries: 10


  kafka:
    image: apache/kafka:3.9.2
    container_name: de-kafka

    ports:
      - "${KAFKA_EXTERNAL_PORT}:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: >
        EXTERNAL://:9092,
        INTERNAL://:29092,
        CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: >
        EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT},
        INTERNAL://kafka:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT,
        EXTERNAL:PLAINTEXT,
        INTERNAL:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    volumes:
      - kafka_data:/var/lib/kafka/data

    mem_limit: 2g
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.9.2
    container_name: de-kafka-init

    depends_on:
      - kafka

    environment:
      KAFKA_TOPIC: ${KAFKA_TOPIC}

    volumes:
      - ./docker/kafka/init-kafka.sh:/init-kafka.sh:ro

    command:
      - /bin/bash
      - /init-kafka.sh

  raw-loader:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: de-raw-loader

    environment:
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_SECURE: ${CLICKHOUSE_SECURE}

      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL}

    command:
      - python
      - -m
      - raw_loader.load_kafka_events

    depends_on:
      clickhouse:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

    restart: unless-stopped

  airflow-postgres:
    image: postgres:16
    container_name: de-airflow-postgres

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U airflow -d airflow
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  airflow-init:
    image: apache/airflow:2.10.5-python3.12
    container_name: de-airflow-init

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    depends_on:
      airflow-postgres:
        condition: service_healthy

    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com


  airflow-webserver:
    image: apache/airflow:2.10.5-python3.12
    container_name: de-airflow-webserver

    ports:
      - "${AIRFLOW_PORT}:8080"

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow/src/py

    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - airflow_logs:/opt/airflow/logs

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    command: webserver

    restart: unless-stopped

  airflow-scheduler:
    image: apache/airflow:2.10.5-python3.12
    container_name: de-airflow-scheduler

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      PYTHONPATH: /opt/airflow/src/py
      KAFKA_TOPIC: ${KAFKA_TOPIC}

      _PIP_ADDITIONAL_REQUIREMENTS: clickhouse-connect

    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - airflow_logs:/opt/airflow/logs

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    command: scheduler

    restart: unless-stopped

volumes:
  clickhouse_data:
  kafka_data:
  airflow_postgres_data:
  airflow_logs: